[package]
name = "aisix-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix: Admin API + Playground + OpenAPI"

[dependencies]
aisix-core = { path = "../aisix-core" }
aisix-etcd = { path = "../aisix-etcd" }
aisix-proxy = { path = "../aisix-proxy" }
tokio.workspace = true
axum.workspace = true
bytes.workspace = true
futures.workspace = true
tower.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
async-trait.workspace = true
dashmap.workspace = true
etcd-client.workspace = true
# Admin session cookies (`session.rs`): CSPRNG token generation, the
# SHA-256 token hash, and its lowercase-hex encoding. All three are
# already in the build graph through `aisix-core` / `aisix-proxy`
# (`ApiKey::hash_bearer` is the same SHA-256-over-bytes-then-hex
# construction), so these are direct edges, not new crates.
rand.workspace = true
sha2.workspace = true
hex.workspace = true
aisix-obs = { path = "../aisix-obs" }
# The embedded OpenAI-compatible provider catalog behind
# `GET /admin/v1/preset_providers`. Already in the build graph through
# `aisix-proxy`; this is the direct edge, not a new crate.
aisix-provider-openai = { path = "../aisix-provider-openai" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
testcontainers.workspace = true
aisix-gateway = { path = "../aisix-gateway" }
aisix-core = { path = "../aisix-core" }
wiremock.workspace = true
tempfile.workspace = true
